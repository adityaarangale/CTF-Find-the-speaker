<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2b6d"/>
      <stop offset="50%" stop-color="#2e4bd6"/>
      <stop offset="100%" stop-color="#6b3fa0"/>
    </linearGradient>
    <linearGradient id="ogShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c5fd6"/>
      <stop offset="100%" stop-color="#2e4bd6"/>
    </linearGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Circuit-board decoration lines -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <line x1="400" y1="100" x2="400" y2="200" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <line x1="400" y1="200" x2="600" y2="200" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <circle cx="400" cy="100" r="5" fill="#9c5fd6" opacity="0.4"/>
  <circle cx="400" cy="200" r="5" fill="#9c5fd6" opacity="0.4"/>

  <line x1="1200" y1="500" x2="800" y2="500" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <line x1="800" y1="500" x2="800" y2="400" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <line x1="800" y1="400" x2="600" y2="400" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <circle cx="800" cy="500" r="5" fill="#2e4bd6" opacity="0.4"/>
  <circle cx="800" cy="400" r="5" fill="#2e4bd6" opacity="0.4"/>

  <!-- Large shield icon -->
  <g transform="translate(100, 150)">
    <path d="M80 20 L200 0 L320 20 L320 160 C320 260 200 310 200 310 C200 310 80 260 80 160 Z" fill="url(#ogShield)" opacity="0.25" stroke="#9c5fd6" stroke-width="2"/>
    <circle cx="200" cy="120" r="18" fill="#fff" opacity="0.15"/>
    <circle cx="150" cy="165" r="12" fill="#fff" opacity="0.1"/>
    <circle cx="250" cy="165" r="12" fill="#fff" opacity="0.1"/>
    <line x1="200" y1="120" x2="150" y2="165" stroke="#fff" stroke-width="2" opacity="0.2"/>
    <line x1="200" y1="120" x2="250" y2="165" stroke="#fff" stroke-width="2" opacity="0.2"/>
  </g>

  <!-- Main title -->
  <text x="600" y="240" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">CyberTech Summit 2026</text>

  <!-- Subtitle line -->
  <rect x="400" y="268" width="400" height="3" rx="2" fill="#9c5fd6" opacity="0.8"/>

  <text x="600" y="330" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#c5cde8" text-anchor="middle" letter-spacing="1">Where Security Meets Innovation</text>

  <!-- Date and venue -->
  <text x="600" y="400" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#9c8fd6" text-anchor="middle">March 14–15, 2026  ·  Pune International Convention Centre</text>

  <!-- Bottom tag -->
  <rect x="460" y="500" width="280" height="50" rx="25" fill="#2e4bd6" opacity="0.5" stroke="#9c5fd6" stroke-width="1.5"/>
  <text x="600" y="532" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">OFFICIAL CONFERENCE SITE</text>
</svg>
