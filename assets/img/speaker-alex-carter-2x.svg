<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
  <defs>
    <linearGradient id="bg2x" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <linearGradient id="ng2x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b3fa0"/>
      <stop offset="100%" stop-color="#2e4bd6"/>
    </linearGradient>
    <linearGradient id="shirt2x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e4bd6"/>
      <stop offset="100%" stop-color="#1a2b6d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="900" fill="url(#bg2x)"/>

  <!-- Desk surface -->
  <rect x="0" y="660" width="900" height="240" fill="#bcaaa4" opacity="0.5"/>

  <!-- Body -->
  <ellipse cx="450" cy="860" rx="280" ry="260" fill="url(#shirt2x)"/>

  <!-- Neck -->
  <rect x="398" y="480" width="104" height="120" rx="32" fill="#c8956c"/>

  <!-- Head -->
  <ellipse cx="450" cy="330" rx="148" ry="170" fill="#c8956c"/>

  <!-- Hair -->
  <ellipse cx="450" cy="188" rx="148" ry="60" fill="#3d2b1f"/>
  <rect x="302" y="188" width="296" height="60" fill="#3d2b1f"/>
  <ellipse cx="306" cy="310" rx="28" ry="80" fill="#3d2b1f"/>
  <ellipse cx="594" cy="310" rx="28" ry="80" fill="#3d2b1f"/>

  <!-- Eyes -->
  <ellipse cx="400" cy="310" rx="22" ry="16" fill="#fff"/>
  <ellipse cx="500" cy="310" rx="22" ry="16" fill="#fff"/>
  <circle cx="404" cy="312" r="11" fill="#3d2b1f"/>
  <circle cx="504" cy="312" r="11" fill="#3d2b1f"/>
  <circle cx="407" cy="308" r="4" fill="#fff"/>
  <circle cx="507" cy="308" r="4" fill="#fff"/>

  <!-- Eyebrows -->
  <path d="M378 284 Q400 275 422 282" stroke="#3d2b1f" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M478 282 Q500 275 522 284" stroke="#3d2b1f" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M442 348 Q428 375 442 385 Q450 390 458 385 Q472 375 458 348" stroke="#b07a52" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M412 422 Q450 446 488 422" stroke="#a0614a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="304" cy="340" rx="22" ry="32" fill="#c8956c"/>
  <ellipse cx="596" cy="340" rx="22" ry="32" fill="#c8956c"/>

  <!-- Laptop on desk -->
  <g transform="translate(100, 580)">
    <!-- Laptop base -->
    <rect x="80" y="90" width="540" height="16" rx="5" fill="#424242"/>
    <rect x="65" y="104" width="570" height="80" rx="6" fill="#616161"/>
    <!-- Keyboard rows -->
    <rect x="90" y="112" width="510" height="12" rx="3" fill="#424242" opacity="0.7"/>
    <rect x="90" y="130" width="510" height="12" rx="3" fill="#424242" opacity="0.7"/>
    <rect x="90" y="148" width="450" height="12" rx="3" fill="#424242" opacity="0.7"/>

    <!-- Laptop lid -->
    <rect x="65" y="-190" width="570" height="290" rx="10" fill="#37474f"/>
    <!-- Screen bezel -->
    <rect x="82" y="-178" width="536" height="268" rx="8" fill="#212121"/>
    <!-- Screen -->
    <rect x="96" y="-166" width="508" height="246" rx="4" fill="#1a237e" opacity="0.9"/>
    <!-- Code lines on screen -->
    <rect x="116" y="-146" width="280" height="10" rx="3" fill="#7986cb" opacity="0.8"/>
    <rect x="116" y="-128" width="220" height="10" rx="3" fill="#4db6ac" opacity="0.7"/>
    <rect x="136" y="-110" width="260" height="10" rx="3" fill="#80cbc4" opacity="0.6"/>
    <rect x="116" y="-92" width="200" height="10" rx="3" fill="#7986cb" opacity="0.7"/>
    <rect x="136" y="-74" width="320" height="10" rx="3" fill="#4db6ac" opacity="0.6"/>
    <rect x="116" y="-56" width="180" height="10" rx="3" fill="#80cbc4" opacity="0.5"/>
    <rect x="136" y="-38" width="270" height="10" rx="3" fill="#9575cd" opacity="0.6"/>
    <rect x="116" y="-20" width="210" height="10" rx="3" fill="#7986cb" opacity="0.7"/>
    <rect x="116" y="-2" width="240" height="10" rx="3" fill="#4db6ac" opacity="0.5"/>
    <rect x="116" y="16" width="120" height="14" rx="3" fill="#80ff80" opacity="0.7"/>

    <!-- NimbusGrid sticker — large and very clear -->
    <g transform="translate(360, -180)">
      <!-- Sticker outer -->
      <rect x="0" y="0" width="160" height="96" rx="14" fill="#ffffff" opacity="0.97"/>
      <rect x="3" y="3" width="154" height="90" rx="12" fill="#f3e8ff" stroke="#9c5fd6" stroke-width="2.5"/>

      <!-- Cloud/grid logo on sticker (large version) -->
      <path d="M16 64 C11 64 7 60 7 54 C7 50 9.5 47 13 46 C13 45.6 13 45.2 13 44.8 C13 37.6 19 32 26.5 32 C30.5 32 34 33.8 36.5 36.6 C37.5 36.3 38.5 36 39.7 36 C45.3 36 49.8 40.4 49.8 46 C49.8 46.4 49.8 46.8 49.7 47.2 C52 48.5 53.5 51 53.5 53.8 C53.5 59.4 49 64 43.4 64 Z" fill="url(#ng2x)" opacity="0.2" stroke="#6b3fa0" stroke-width="2"/>

      <!-- Grid dots - large enough to clearly see -->
      <circle cx="22" cy="46" r="4" fill="#6b3fa0"/>
      <circle cx="31" cy="46" r="4" fill="#6b3fa0"/>
      <circle cx="40" cy="46" r="4" fill="#6b3fa0"/>
      <circle cx="22" cy="55" r="4" fill="#2e4bd6"/>
      <circle cx="31" cy="55" r="4" fill="#2e4bd6"/>
      <circle cx="40" cy="55" r="4" fill="#2e4bd6"/>
      <circle cx="31" cy="37" r="4" fill="#9c5fd6"/>

      <!-- Grid connecting lines -->
      <line x1="22" y1="37" x2="22" y2="62" stroke="#6b3fa0" stroke-width="1.5" opacity="0.5"/>
      <line x1="31" y1="33" x2="31" y2="62" stroke="#6b3fa0" stroke-width="1.5" opacity="0.5"/>
      <line x1="40" y1="37" x2="40" y2="62" stroke="#6b3fa0" stroke-width="1.5" opacity="0.5"/>
      <line x1="16" y1="46" x2="48" y2="46" stroke="#6b3fa0" stroke-width="1.5" opacity="0.5"/>
      <line x1="16" y1="55" x2="48" y2="55" stroke="#6b3fa0" stroke-width="1.5" opacity="0.5"/>

      <!-- Sticker text - bold and clear -->
      <text x="62" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#1a2b6d" letter-spacing="0.3">NimbusGrid</text>
      <text x="62" y="63" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#6b3fa0" letter-spacing="1.2">TECHNOLOGIES</text>
    </g>

    <!-- Small zero-trust sticker (distraction) -->
    <g transform="translate(210, -170)">
      <rect x="0" y="0" width="110" height="52" rx="8" fill="#e3f2fd" opacity="0.9" stroke="#42a5f5" stroke-width="1.5"/>
      <text x="12" y="24" font-family="monospace" font-size="14" fill="#1565c0" font-weight="700">{"}</text>
      <text x="6" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#1565c0">zero-trust</text>
    </g>
  </g>
</svg>
