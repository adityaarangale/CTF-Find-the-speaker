<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e4bd6"/>
      <stop offset="100%" stop-color="#1a2b6d"/>
    </linearGradient>
    <linearGradient id="stickerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b3fa0"/>
      <stop offset="100%" stop-color="#2e4bd6"/>
    </linearGradient>
    <clipPath id="faceClip">
      <ellipse cx="300" cy="230" rx="90" ry="105"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <!-- Subtle office background suggestion -->
  <rect x="0" y="500" width="600" height="250" fill="#d1d5e8" opacity="0.4"/>
  <rect x="50" y="460" width="500" height="8" rx="4" fill="#b0bec5" opacity="0.5"/>

  <!-- Body / torso -->
  <ellipse cx="300" cy="620" rx="160" ry="180" fill="url(#shirtGrad)"/>

  <!-- Neck -->
  <rect x="268" y="320" width="64" height="80" rx="20" fill="#c8956c"/>

  <!-- Head -->
  <ellipse cx="300" cy="230" rx="90" ry="105" fill="#c8956c"/>

  <!-- Hair -->
  <ellipse cx="300" cy="148" rx="90" ry="40" fill="#3d2b1f"/>
  <rect x="210" y="148" width="180" height="40" fill="#3d2b1f"/>
  <ellipse cx="212" cy="210" rx="18" ry="50" fill="#3d2b1f"/>
  <ellipse cx="388" cy="210" rx="18" ry="50" fill="#3d2b1f"/>

  <!-- Eyes -->
  <ellipse cx="268" cy="218" rx="14" ry="10" fill="#fff"/>
  <ellipse cx="332" cy="218" rx="14" ry="10" fill="#fff"/>
  <circle cx="271" cy="219" r="7" fill="#3d2b1f"/>
  <circle cx="335" cy="219" r="7" fill="#3d2b1f"/>
  <circle cx="273" cy="217" r="2.5" fill="#fff"/>
  <circle cx="337" cy="217" r="2.5" fill="#fff"/>

  <!-- Eyebrows -->
  <path d="M254 202 Q268 196 282 200" stroke="#3d2b1f" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M318 200 Q332 196 346 202" stroke="#3d2b1f" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M295 230 Q288 248 295 255 Q300 258 305 255 Q312 248 305 230" stroke="#b07a52" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M276 278 Q300 294 324 278" stroke="#a0614a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Ears -->
  <ellipse cx="212" cy="235" rx="14" ry="20" fill="#c8956c"/>
  <ellipse cx="388" cy="235" rx="14" ry="20" fill="#c8956c"/>

  <!-- Laptop (angled, sitting on desk) -->
  <g transform="translate(60, 460)">
    <!-- Desk surface -->
    <rect x="0" y="120" width="480" height="16" rx="4" fill="#8d6e63"/>

    <!-- Laptop base -->
    <rect x="80" y="70" width="320" height="12" rx="3" fill="#424242"/>
    <rect x="70" y="80" width="340" height="60" rx="4" fill="#616161"/>
    <!-- Keyboard area -->
    <rect x="85" y="85" width="310" height="50" rx="3" fill="#424242"/>
    <!-- Key rows -->
    <rect x="95" y="92" width="290" height="8" rx="2" fill="#757575" opacity="0.6"/>
    <rect x="95" y="104" width="290" height="8" rx="2" fill="#757575" opacity="0.6"/>
    <rect x="95" y="116" width="250" height="8" rx="2" fill="#757575" opacity="0.6"/>

    <!-- Laptop lid (slightly open/angled) -->
    <rect x="70" y="-90" width="340" height="165" rx="6" fill="#37474f"/>
    <!-- Screen bezel -->
    <rect x="80" y="-82" width="320" height="150" rx="4" fill="#212121"/>
    <!-- Screen content -->
    <rect x="88" y="-76" width="304" height="138" rx="2" fill="#1a237e" opacity="0.9"/>
    <!-- Code on screen (flavor) -->
    <rect x="98" y="-62" width="180" height="6" rx="2" fill="#7986cb" opacity="0.8"/>
    <rect x="98" y="-50" width="140" height="6" rx="2" fill="#4db6ac" opacity="0.7"/>
    <rect x="108" y="-38" width="160" height="6" rx="2" fill="#80cbc4" opacity="0.6"/>
    <rect x="98" y="-26" width="120" height="6" rx="2" fill="#7986cb" opacity="0.7"/>
    <rect x="108" y="-14" width="200" height="6" rx="2" fill="#4db6ac" opacity="0.6"/>
    <rect x="98" y="-2" width="100" height="6" rx="2" fill="#80cbc4" opacity="0.5"/>
    <rect x="108" y="10" width="170" height="6" rx="2" fill="#9575cd" opacity="0.6"/>
    <rect x="98" y="22" width="130" height="6" rx="2" fill="#7986cb" opacity="0.7"/>
    <rect x="98" y="34" width="150" height="6" rx="2" fill="#4db6ac" opacity="0.5"/>
    <!-- Terminal cursor -->
    <rect x="98" y="48" width="8" height="10" rx="1" fill="#80ff80" opacity="0.8"/>

    <!-- NimbusGrid sticker on laptop lid - CLEARLY VISIBLE -->
    <g transform="translate(230, -75)">
      <!-- Sticker background (white rounded rect) -->
      <rect x="0" y="0" width="90" height="54" rx="8" fill="#ffffff" opacity="0.95"/>
      <rect x="2" y="2" width="86" height="50" rx="7" fill="#f3e8ff" stroke="#9c5fd6" stroke-width="1.5"/>

      <!-- Mini nimbusgrid cloud/grid logo on sticker -->
      <!-- Cloud shape -->
      <path d="M10 38 C7 38 4.5 35.5 4.5 32 C4.5 29.5 6 27.5 8.2 27 C8.2 26.8 8.2 26.6 8.2 26.3 C8.2 22.2 11.7 19 16 19 C18.2 19 20.2 19.9 21.6 21.4 C22.2 21.2 22.8 21 23.5 21 C26.3 21 28.5 23.2 28.5 26 C28.5 26.2 28.5 26.4 28.4 26.6 C29.7 27.3 30.5 28.7 30.5 30.3 C30.5 33.2 28.1 35.5 25.2 35.5 L10 38 Z" fill="url(#stickerGrad)" opacity="0.18" stroke="#6b3fa0" stroke-width="1.2"/>
      <!-- Grid dots on sticker logo -->
      <circle cx="13" cy="28" r="1.8" fill="#6b3fa0"/>
      <circle cx="18" cy="28" r="1.8" fill="#6b3fa0"/>
      <circle cx="23" cy="28" r="1.8" fill="#6b3fa0"/>
      <circle cx="13" cy="32" r="1.8" fill="#2e4bd6"/>
      <circle cx="18" cy="32" r="1.8" fill="#2e4bd6"/>
      <circle cx="23" cy="32" r="1.8" fill="#2e4bd6"/>
      <circle cx="18" cy="24" r="1.8" fill="#9c5fd6"/>
      <!-- Grid lines -->
      <line x1="13" y1="24.5" x2="13" y2="35" stroke="#6b3fa0" stroke-width="0.8" opacity="0.5"/>
      <line x1="18" y1="22" x2="18" y2="35" stroke="#6b3fa0" stroke-width="0.8" opacity="0.5"/>
      <line x1="23" y1="24.5" x2="23" y2="35" stroke="#6b3fa0" stroke-width="0.8" opacity="0.5"/>
      <line x1="10" y1="28" x2="26.5" y2="28" stroke="#6b3fa0" stroke-width="0.8" opacity="0.5"/>
      <line x1="10" y1="32" x2="26.5" y2="32" stroke="#6b3fa0" stroke-width="0.8" opacity="0.5"/>

      <!-- Sticker text -->
      <text x="35" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#1a2b6d">NimbusGrid</text>
      <text x="35" y="37" font-family="'Segoe UI', Arial, sans-serif" font-size="5.5" font-weight="400" fill="#6b3fa0" letter-spacing="0.5">TECHNOLOGIES</text>
    </g>

    <!-- Second small decorative sticker (distraction) -->
    <g transform="translate(130, -68)">
      <rect x="0" y="0" width="60" height="28" rx="5" fill="#e3f2fd" opacity="0.9" stroke="#42a5f5" stroke-width="1"/>
      <text x="8" y="12" font-family="monospace" font-size="7" fill="#1565c0" font-weight="600">{"}</text>
      <text x="4" y="23" font-family="'Segoe UI', Arial, sans-serif" font-size="6" fill="#1565c0">zero-trust</text>
    </g>
  </g>
</svg>
