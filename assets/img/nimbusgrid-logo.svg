<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 44" fill="none">
  <defs>
    <linearGradient id="ngGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b3fa0"/>
      <stop offset="100%" stop-color="#2e4bd6"/>
    </linearGradient>
  </defs>
  <!-- Cloud shape made of grid/hex lines -->
  <g transform="translate(2, 4)">
    <!-- Cloud silhouette -->
    <path d="M10 28 C6 28 3 25 3 21 C3 18 5 16 8 15.5 C8 15.2 8 15 8 14.7 C8 9.5 12.5 5 18 5 C21 5 23.7 6.4 25.5 8.5 C26.3 8.2 27.1 8 28 8 C31.9 8 35 11.1 35 15 C35 15.3 35 15.6 34.9 15.9 C36.7 16.8 38 18.7 38 21 C38 24.9 34.9 28 31 28 Z" fill="url(#ngGrad)" opacity="0.15" stroke="url(#ngGrad)" stroke-width="1.5"/>
    <!-- Grid lines inside cloud -->
    <line x1="10" y1="17" x2="34" y2="17" stroke="url(#ngGrad)" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="21" x2="34" y2="21" stroke="url(#ngGrad)" stroke-width="1" opacity="0.5"/>
    <line x1="10" y1="25" x2="32" y2="25" stroke="url(#ngGrad)" stroke-width="1" opacity="0.5"/>
    <line x1="14" y1="12" x2="14" y2="28" stroke="url(#ngGrad)" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="8" x2="20" y2="28" stroke="url(#ngGrad)" stroke-width="1" opacity="0.5"/>
    <line x1="26" y1="10" x2="26" y2="28" stroke="url(#ngGrad)" stroke-width="1" opacity="0.5"/>
    <line x1="32" y1="14" x2="32" y2="28" stroke="url(#ngGrad)" stroke-width="1" opacity="0.5"/>
    <!-- Node dots at intersections -->
    <circle cx="14" cy="17" r="2" fill="#6b3fa0"/>
    <circle cx="20" cy="17" r="2" fill="#6b3fa0"/>
    <circle cx="26" cy="17" r="2" fill="#6b3fa0"/>
    <circle cx="14" cy="21" r="2" fill="#2e4bd6"/>
    <circle cx="20" cy="21" r="2" fill="#2e4bd6"/>
    <circle cx="26" cy="21" r="2" fill="#2e4bd6"/>
    <circle cx="20" cy="13" r="2" fill="#9c5fd6"/>
  </g>
  <!-- Wordmark -->
  <text x="46" y="20" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a2b6d" letter-spacing="0.3">NimbusGrid</text>
  <text x="46" y="33" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="400" fill="#6b3fa0" letter-spacing="0.8">TECHNOLOGIES</text>
</svg>
